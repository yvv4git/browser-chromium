services:
  chromium:
    image: yvv4docker/browser-chromium:${BROWSER_VARIANT:-default}
    container_name: browser-chromium
    build:
      context: .
      dockerfile: docker/${BROWSER_VARIANT:-default}/Dockerfile
    ports:
      - "9222:9223"
      - "3000:3000"
      - "8080:8080"
    environment:
      - "RESOLUTION=${RESOLUTION:-1920x1080}"
      - "PROXY=${PROXY:-}"
      - "CHROME_ARGS_EXTRA=${CHROME_ARGS_EXTRA:-}"
      - "BROWSER_MODE=${BROWSER_MODE:-vnc}"
      - "SELKIES_BASIC_AUTH_PASSWORD=${SELKIES_BASIC_AUTH_PASSWORD:-}"
    volumes:
      - "./profile:/config"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 2g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
